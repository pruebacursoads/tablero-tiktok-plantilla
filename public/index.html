<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero TikTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4fa; --card:#ffffff; --ink:#1b1730; --ink2:#575270; --ink3:#857fa0; --line:#e6e3f0;
  --accent:#6d3df0; --accent-soft:#eee9fe; --accent-ink:#4a22c4; --c2:#d99a00; --c3:#12907f; --c4:#d1407a; --c5:#7b7596;
  --good:#12805c; --good-bg:#e3f6ee; --warn:#a15c00; --warn-bg:#fff1d6; --bad:#c0272d; --bad-bg:#fde8e8;
  --shadow:0 1px 2px rgba(27,23,48,.06),0 4px 16px rgba(27,23,48,.05); --side:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#110e1f; --card:#1b1730; --ink:#f1eefc; --ink2:#b4aed0; --ink3:#8d86ad; --line:#2e2848;
    --accent:#9b79ff; --accent-soft:#2a2150; --accent-ink:#c7b5ff; --c2:#ffc15a; --c3:#4fd1c1; --c4:#ff8fb3; --c5:#9a94b5;
    --good:#4ad6a0; --good-bg:#0f2e25; --warn:#ffc15a; --warn-bg:#33270c; --bad:#ff7b80; --bad-bg:#3a1517;
    --shadow:none; --side:#16122a;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{padding:4px 10px 16px}
.brand b{display:block;font-size:15px;font-weight:800;line-height:1.2}
.brand span{font-size:12px;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink2);text-align:left}
.nav button svg{flex:none;width:19px;height:19px}
.nav button:hover{background:var(--accent-soft)}
.nav button[aria-current="page"]{background:var(--accent);color:#fff}
.side .foot{margin-top:auto;padding:10px;font-size:11px;color:var(--ink3)}
.main{padding:22px 28px 60px;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.head h1{margin:0;font-size:22px;font-weight:800}
.head .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.dates{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.dates input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;font-size:12px;color-scheme:light dark}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:26px 0 10px;font-weight:700}
h3{margin:0 0 4px;font-size:15px}
.hint{font-size:12px;color:var(--ink3);margin:0 0 10px}
.verdict{display:flex;gap:16px;align-items:center}
.dot{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.dot i{width:24px;height:24px;border-radius:50%;display:block}
.dot.good{background:var(--good-bg)} .dot.good i{background:var(--good)}
.dot.warn{background:var(--warn-bg)} .dot.warn i{background:var(--warn)}
.dot.bad{background:var(--bad-bg)} .dot.bad i{background:var(--bad)}
.verdict h3{font-size:19px;font-weight:800}
.verdict p{margin:0;color:var(--ink2);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{text-align:left;padding:14px 14px 10px;cursor:pointer;display:block;width:100%;border-width:1.5px}
.kpi:hover{border-color:var(--accent)}
.kpi[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin:3px 0 1px;letter-spacing:-.02em}
.kpi .d{font-size:11.5px;font-weight:700}
.d.good{color:var(--good)} .d.bad{color:var(--bad)} .d.flat{color:var(--ink3)}
.kpi svg{display:block;width:100%;height:28px;margin-top:6px}
.kpi .more{font-size:11px;color:var(--accent-ink);font-weight:700;margin-top:4px}
.detail{margin-top:10px;border-color:var(--accent);animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat .l{font-size:11.5px;color:var(--ink3);font-weight:600}
.stat .v{font-size:18px;font-weight:800}
.stat .s{font-size:11.5px;color:var(--ink3)}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .08s;z-index:50;white-space:nowrap}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;gap:2px;margin:8px 0}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.legend b{color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(80px,140px) 1fr 52px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hb .ht{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.hb .ht i{display:block;height:100%;background:var(--accent);border-radius:6px}
.hb b{text-align:right}
.actions{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.main,.card{min-width:0}
.action{display:flex;gap:14px;padding:14px 16px}
.action .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.action b{display:block;font-size:15px;margin-bottom:2px}
.action span{font-size:13px;color:var(--ink2)}
.action .why{display:block;margin-top:6px;font-size:12px;color:var(--ink3)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.tag.good{background:var(--good-bg);color:var(--good)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.info{background:var(--accent-soft);color:var(--accent-ink)}
.linkbtn{border:0;background:none;color:var(--accent-ink);font-weight:700;font-size:13px;padding:6px 0}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
.tools input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
.tools select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0}
th[aria-sort]{color:var(--accent-ink)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:230px;max-width:290px;white-space:normal}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--accent-soft)}
tr.row:hover td:first-child{background:var(--accent-soft)}
td .cap{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
td .dt{font-size:11px;color:var(--ink3)}
tr.det td{background:var(--bg);white-space:normal;text-align:left;cursor:default}
tr.det td:first-child{position:static;max-width:none}
.good-t{color:var(--good);font-weight:700} .bad-t{color:var(--bad);font-weight:700}
.empty{padding:34px 16px;text-align:center;color:var(--ink2)}
.note{font-size:12px;color:var(--ink3);margin-top:10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;font-weight:600}
.goal{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.goal input{width:90px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px}
.pbar{height:10px;border-radius:6px;background:var(--bg);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;height:auto;top:auto;z-index:20;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
  .brand,.side .foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:3px;font-size:10px;padding:6px 4px;flex:1;align-items:center;text-align:center}
  .main{padding:16px 16px 96px}
}
/* ---- nivel BI ---- */
.nav .short{display:none}
@media(max-width:860px){.nav .full{display:none}.nav .short{display:inline}}
table.plain th{cursor:default}
table.plain td,table.plain th{white-space:normal;text-align:left}
table.plain td:first-child,table.plain th:first-child{position:static;min-width:0;max-width:none}
.narr ul.x{margin:0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:6px}
.score .ring{width:112px;height:112px}
.score .ring .num b{font-size:30px}
.sb{grid-template-columns:78px 1fr}
@media(max-width:980px){.hero{grid-template-columns:minmax(0,1fr)}}
.score{display:flex;gap:18px;align-items:center}
.ring{flex:none;position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .num b{font-size:34px;line-height:1;font-weight:800;letter-spacing:-.03em}
.ring .num span{font-size:11px;color:var(--ink3);font-weight:700;margin-top:2px}
.sbars{flex:1;min-width:0;display:grid;gap:7px}
.sb{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;font-size:11.5px}
.sb .t{height:7px;background:var(--bg);border-radius:5px;overflow:hidden}
.sb .t i{display:block;height:100%;border-radius:5px}
.sb em{grid-column:2;font-style:normal;color:var(--ink3);margin-top:-5px;font-size:11px}
.band{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;margin-bottom:6px}
.narr ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.narr li{display:flex;gap:10px;font-size:13.5px;color:var(--ink2)}
.narr li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px}
.narr li b{color:var(--ink)}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.mchips button{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink2)}
.mchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink2);margin-top:6px}
.lg i{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);margin-right:6px;vertical-align:3px;border-radius:2px}
.lg i.pv{border-top:2px dashed var(--ink3)}
.fun{display:grid;gap:10px;margin-top:6px}
.fr{display:grid;grid-template-columns:minmax(0,1fr);gap:3px}
.fr .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.fr .top b{font-size:18px;letter-spacing:-.02em}
.fr .bar{height:26px;border-radius:8px;background:var(--bg);overflow:hidden}
.fr .bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.fr .cv{font-size:11.5px;color:var(--ink3)}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dn svg{flex:none;width:132px;height:132px}
.dn .lgd{flex:1;min-width:140px;display:grid;gap:5px;font-size:12.5px}
.dn .lgd div{display:flex;justify-content:space-between;gap:8px}
.dn .lgd span{display:flex;align-items:center;gap:6px;min-width:0}
.cal{overflow-x:auto}
.cal svg{display:block;max-width:100%;height:auto}
.heat{display:grid;grid-template-columns:96px repeat(4,minmax(0,1fr));gap:4px;font-size:12px;margin-top:8px}
.heat .h{font-size:11px;color:var(--ink3);font-weight:700;text-align:center;align-self:end;padding-bottom:2px}
.heat .d{font-weight:700;align-self:center}
.heat .c{border-radius:8px;padding:8px 4px;text-align:center;min-height:46px;display:grid;place-content:center;background:var(--bg);color:var(--ink3)}
.heat .c b{font-size:13px;color:var(--ink)}
.heat .c small{font-size:10.5px;opacity:.85}
.acts{display:flex;gap:6px}
.acts button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:7px 11px;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink2)}
.acts button:hover{border-color:var(--accent);color:var(--accent-ink)}
.acts svg{width:15px;height:15px}
@media(max-width:560px){.acts span{display:none}}
:root[data-theme="dark"]{
  --bg:#110e1f; --card:#1b1730; --ink:#f1eefc; --ink2:#b4aed0; --ink3:#8d86ad; --line:#2e2848;
  --accent:#9b79ff; --accent-soft:#2a2150; --accent-ink:#c7b5ff; --c2:#ffc15a; --c3:#4fd1c1; --c4:#ff8fb3; --c5:#9a94b5;
  --good:#4ad6a0; --good-bg:#0f2e25; --warn:#ffc15a; --warn-bg:#33270c; --bad:#ff7b80; --bad-bg:#3a1517; --shadow:none; --side:#16122a;
}
@media print{
  .side,.range,.acts,.tools,.linkbtn,.chips{display:none!important}
  .app{display:block}.main{padding:0;max-width:none}
  body,:root{background:#fff!important}
  .card{box-shadow:none!important;break-inside:avoid}
}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b id="brandName">Tablero TikTok</b><span id="brandUser"></span></div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main class="main">
    <div class="head">
      <div><h1 id="title">Resumen</h1><div class="sub" id="sub"></div></div>
      <div class="range" id="range"></div>
      <div class="acts">
        <button data-act="theme" title="Cambiar tema claro u oscuro" aria-label="Cambiar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="themeTxt">Tema</span></button>
        <button data-act="full" title="Pantalla completa para presentar" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg><span>Presentar</span></button>
        <button data-act="print" title="Imprimir o guardar como PDF" aria-label="Imprimir o PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7" rx="1"/></svg><span>PDF</span></button>
      </div>
    </div>
    <div id="banner"></div>
    <div id="content"><div class="empty">Cargando tu tablero…</div></div>
  </main>
</div>
<div class="tip" id="tip"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const fmt = (n, d = 0) => Number(n).toLocaleString("es-PE", { maximumFractionDigits: d, minimumFractionDigits: d });
const pct = (x, d = 1) => fmt(x * 100, d) + "%";
const compact = (n) => (Math.abs(n) >= 10000 ? fmt(n / 1000, 0) + "k" : Math.abs(n) >= 1000 ? fmt(n / 1000, 1) + "k" : fmt(n));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sum = (a, f) => a.reduce((t, r) => t + (typeof f === "function" ? f(r) : r[f] || 0), 0);
const median = (a) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const quant = (a, q) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), p = (s.length - 1) * q, i = Math.floor(p); return s[i] + (s[Math.min(i + 1, s.length - 1)] - s[i]) * (p - i); };
const addD = (s, n) => new Date(Date.parse(s + "T12:00:00Z") + n * 864e5).toISOString().slice(0, 10);
const diffD = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);
const dFmt = (iso, o = { day: "numeric", month: "short" }) => new Date(iso + "T12:00:00Z").toLocaleDateString("es-PE", { ...o, timeZone: "UTC" });
const short = (t, n = 60) => (t.length > n ? t.slice(0, n - 1).trim() + "…" : t);
const DOW = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const DOW_ORDER = [1, 2, 3, 4, 5, 6, 0];

let DATA, OFF = -5, MIN, MAX;
const S = { page: "resumen", from: "", to: "", kpi: null, metric: "reach", sort: { k: "fecha", dir: -1 }, open: null, q: "" };

/* ---------- utilidades de datos ---------- */
const vdate = (v) => { // fecha local del video (publicado en UTC → hora del país)
  const ms = v.creado ? Date.parse(v.creado + "Z") : Date.parse(v.fecha + "T12:00:00Z");
  return new Date(ms + OFF * 36e5);
};
const vday = (v) => vdate(v).toISOString().slice(0, 10);
const vhour = (v) => vdate(v).getUTCHours();
const vdow = (v) => vdate(v).getUTCDay();
const vm = (v) => ({ ...v,
  er: v.views ? (v.likes + v.comments + v.shares) / v.views : 0,
  share1k: v.views ? (v.shares / v.views) * 1000 : 0,
  fav1k: v.views ? (v.favorites / v.views) * 1000 : 0,
  watchPct: v.dur ? v.avg_watch / v.dur : 0,
  segK: v.views ? (v.new_followers / v.views) * 1000 : 0,

      ["4 · Vida larga", "Un video útil puede volver a circular semanas después, sobre todo por búsqueda y por el tema."],
    ].map((s) => `<div class="stat"><div class="v" style="font-size:15px">${s[0]}</div><div class="s" style="font-size:12.5px;color:var(--ink2);margin-top:4px">${s[1]}</div></div>`).join("")}</div>
    <div class="tw" style="margin-top:14px"><table class="plain"><thead><tr><th>Señal</th><th>Por qué importa</th><th>Tu cuenta</th></tr></thead><tbody>${SIG.map((s) => `<tr><td><b>${s.s}</b></td><td style="white-space:normal;min-width:220px">${s.p}</td><td style="white-space:normal;min-width:180px">${s.m}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">Orden práctico: primero retención, luego compartidos y guardados, y al final los me gusta. Los números «Tú» son la mediana de tus últimos ${n} videos.</p></div>`;
  if (n < 6) return `<div class="actions">${edu}<div class="card empty">Para calcular tu fórmula personal necesito al menos 6 videos con más de 2 días de publicados. Sigue publicando y esta hoja se llenará sola.</div></div>`;

  // ganadores vs resto
  const rk = (f) => { const s = [...all].sort((a, b) => f(a) - f(b)); return new Map(s.map((v, i) => [v.id, i / (n - 1)])); }, rv = rk((v) => v.views), rs = rk((v) => v.segK);
  const sorted = [...all].sort((a, b) => rv.get(b.id) * 0.5 + rs.get(b.id) * 0.5 - (rv.get(a.id) * 0.5 + rs.get(a.id) * 0.5)), k = Math.max(3, Math.round(n * 0.25)), win = sorted.slice(0, k), rest = sorted.slice(k);
  const inW = (v) => (w ? [0, 1, 2].some((j) => (w.s + j) % 24 === vhour(v)) : false);
  const TR = [
    { l: "Duración", f: (v) => v.dur, fm: (q) => fmt(q) + " s" }, { l: "Lo ve completo", f: (v) => v.full_rate, fm: (q) => pct(q) }, { l: "Tiempo visto (% del video)", f: (v) => v.watchPct, fm: (q) => pct(q, 0) },
    { l: "Compartidos / 1k vistas", f: (v) => v.share1k, fm: (q) => fmt(q, 1) }, { l: "Guardados / 1k vistas", f: (v) => v.fav1k, fm: (q) => fmt(q, 1) }, { l: "Comentarios / 1k vistas", f: com1k, fm: (q) => fmt(q, 1) },
    { l: "Largo del texto (palabras)", f: (v) => v.caption.split(/\s+/).length, fm: (q) => fmt(q) },
  ];
  const trs = TR.map((t) => { const a = median(win.map(t.f)), b = median(rest.map(t.f)), r = b ? a / b : 1; return { ...t, a, b, r }; });
  const dif = [...trs].sort((p, q) => Math.abs(Math.log(q.r || 1)) - Math.abs(Math.log(p.r || 1))).slice(0, 2).filter((t) => Math.abs(t.r - 1) > 0.15);
  const winW = w ? win.filter(inW).length / win.length : null, restW = w && rest.length ? rest.filter(inW).length / rest.length : null;
  const sec2 = `<div class="card"><h3>Tu fórmula ganadora</h3><p class="hint">Comparé tus ${win.length} mejores videos (mezcla de vistas y seguidores ganados) con el resto de tus ${n}. Así se ve lo que hacen distinto.</p>
    <div class="tw"><table class="plain"><thead><tr><th>Rasgo</th><th>Tus mejores</th><th>El resto</th><th>Lectura</th></tr></thead><tbody>${trs.map((t) => `<tr><td><b>${t.l}</b></td><td>${t.fm(t.a)}</td><td>${t.fm(t.b)}</td><td>${t.r > 1.15 ? '<span class="good-t">▲ más alto en tus mejores</span>' : t.r < 0.87 ? '<span class="bad-t">▼ más bajo en tus mejores</span>' : '<span style="color:var(--ink3)">• parecido</span>'}</td></tr>`).join("")}
    ${winW !== null && restW !== null ? `<tr><td><b>Publicados en tu mejor ventana</b></td><td>${pct(winW, 0)}</td><td>${pct(restW, 0)}</td><td>${winW > restW + 0.1 ? '<span class="good-t">▲ el horario ayuda</span>' : '<span style="color:var(--ink3)">• sin diferencia clara</span>'}</td></tr>` : ""}</tbody></table></div>
    ${dif.length ? `<p class="note"><b>Lectura rápida:</b> ${dif.map((t) => `en tus mejores videos «${t.l.toLowerCase()}» es ${t.r > 1 ? "más alto" : "más bajo"} (${t.fm(t.a)} vs. ${t.fm(t.b)})`).join("; ")}.</p>` : '<p class="note">Tus mejores videos no se diferencian mucho del resto en estos rasgos: el tema y el gancho pueden pesar más.</p>'}</div>`;

  // temas
  let tagMap = {}; all.forEach((v) => tagsOf(v).forEach((t) => (tagMap[t] ||= new Set()).add(v.id)));
  let topics = Object.entries(tagMap).filter(([, s]) => s.size >= 2 && s.size <= n * 0.7).sort((a, b) => b[1].size - a[1].size).slice(0, 8).map(([t, s]) => ({ l: t, s: gstat(all.filter((v) => s.has(v.id))) }));
  let origen = "hashtags";
  if (topics.length < 2) {
    const wm = {}; all.forEach((v) => new Set((v.caption.toLowerCase().match(/[\p{L}]{6,}/gu) || []).filter((q) => !STOP.has(q))).forEach((q) => (wm[q] ||= new Set()).add(v.id)));
    topics = Object.entries(wm).filter(([, s]) => s.size >= 2 && s.size <= n * 0.6).sort((a, b) => b[1].size - a[1].size).slice(0, 8).map(([t, s]) => ({ l: t, s: gstat(all.filter((v) => s.has(v.id))) })); origen = "palabras clave";
  }
  const sec3 = gtable("Tus temas", `Agrupé tus videos por ${origen} de la descripción. Un tema con buenas vistas y buena conversión es el que debes repetir.`, topics, "Un video puede aparecer en varios temas. Los hashtags que usas en casi todos tus videos se ignoran porque no distinguen entre ellos.");
  const dur = [["Cortos (menos de 30 s)", (v) => v.dur < 30], ["Medios (30 a 60 s)", (v) => v.dur >= 30 && v.dur < 60], ["Largos (más de 60 s)", (v) => v.dur >= 60]].map(([l, f]) => ({ l, s: gstat(all.filter(f)) })).filter((r) => r.s);
  const sec4 = gtable("Duración", "Cuánto dura el video que mejor te funciona. Si dura más, mira el «Tiempo visto»: indica si el contenido sostiene a la gente.", dur);
  const ap = {}; all.forEach((v) => (ap[apertura(v.caption)] ||= []).push(v));
  const apRows = Object.entries(ap).map(([l, vs]) => ({ l, s: gstat(vs) })).sort((a, b) => b.s.n - a.s.n);
  const sec5 = gtable("Gancho: cómo empieza tu video", "Clasifiqué cómo empieza la descripción de cada video. Suele repetir el gancho que dices en voz alta, pero es una pista, no una medición exacta de los primeros 3 segundos.", apRows, "TikTok no entrega la curva de retención por segundo; por eso el gancho se mide con «Lo ve completo» y «Tiempo visto».");

  // diagnóstico por video
  const mV = median(all.map((v) => v.views)), mR = median(all.map((v) => v.full_rate)), mS = median(all.map((v) => v.share1k)), mG = median(all.map((v) => v.segK));
  const diag = (v) => {
    let d;
    if (v.views >= mV && v.full_rate >= mR) d = { c: "good", t: "Ganador: replícalo" };
    else if (v.views < mV && v.full_rate >= mR) d = { c: "info", t: "Buen contenido, poca distribución: prueba otro tema, título u horario" };
    else if (v.views >= mV) d = { c: "warn", t: "Mucho alcance pero se van rápido: refuerza el gancho y el ritmo" };
    else d = { c: "bad", t: "Poco alcance y poca retención: cambia el tema y el gancho" };
    const ex = []; if (mS && v.share1k >= mS * 1.5) ex.push("muy compartible"); if (mG && v.segK >= mG * 1.5) ex.push("convierte en seguidores");
    return { ...d, ex };
  };
  const sec6 = `<div class="card"><h3>Diagnóstico de tus videos recientes</h3><p class="hint">Cada video comparado con tu propia mediana (${fmt(mV)} vistas, ${pct(mR)} lo ve completo).</p><div class="actions">${[...all].sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 8).map((v) => { const d = diag(v); return `<div class="action" style="padding:10px 0;border-top:1px solid var(--line)"><div><b style="font-size:13.5px">${esc(short(v.caption, 80))}</b><span><span class="tag ${d.c}">${d.t.split(":")[0]}</span>${d.t.includes(":") ? d.t.split(":").slice(1).join(":").trim() : ""} ${d.ex.map((e) => `<span class="tag info">${e}</span>`).join("")}</span><span class="why">${fmt(v.views)} vistas · ${pct(v.full_rate)} lo ve completo · ${fmt(v.watchPct * 100)}% del video visto · ${fmt(v.segK, 1)} seg. por 1k vistas</span></div></div>`; }).join("")}</div></div>`;

  // plan de la semana
  const okT = topics.filter((t) => t.s.n >= 2).sort((a, b) => b.s.segK - a.s.segK)[0], okD = [...dur].filter((r) => r.s.n >= 2).sort((a, b) => b.s.med - a.s.med)[0], okA = apRows.filter((r) => r.s.n >= 2).sort((a, b) => b.s.segK - a.s.segK)[0];
  const plan = [
    okT ? `Haz 1 video del tema <b>${esc(okT.l)}</b>, el que mejor convierte vistas en seguidores (${fmt(okT.s.segK, 1)} por 1.000).` : null,
    okD ? `Apunta a una duración de <b>${esc(okD.l.toLowerCase())}</b>, donde tus vistas típicas son ${fmt(okD.s.med)}.` : null,
    okA ? `Abre con una <b>${esc(okA.l.toLowerCase())}</b> en la primera frase y en la descripción.` : null,
    w ? `Publica entre <b>${hh(w.s)} y ${hh(w.e)}</b>, cuando más seguidores tuyos están conectados.` : null,
    "Cierra pidiendo <b>guardar o compartir</b> si es útil, o <b>seguirte</b> si es parte de una serie.",
  ].filter(Boolean);
  const sec7 = `<div class="card"><h3>Tu plan para el próximo video</h3><p class="hint">Armado con lo que mejor te funcionó hasta hoy</p><div class="narr"><ul>${plan.map((p) => `<li><span>${p}</span></li>`).join("")}</ul></div>
    <h3 style="margin-top:18px">Lista antes de publicar</h3><div class="narr"><ul>${["Los primeros 3 segundos prometen un resultado o plantean un problema claro.", "Una sola idea por video; quita pausas y relleno.", "Aporta algo que valga la pena guardar o compartir.", "La descripción incluye las palabras que tu cliente buscaría.", "Terminas con un llamado: guardar, compartir, seguir o ir al enlace.", "Responderás los comentarios en la primera hora."].map((p) => `<li><span>${p}</span></li>`).join("")}</ul></div></div>`;
  return `<div class="actions">${edu}${sec2}${sec3}${sec4}${sec5}${sec6}${sec7}</div>`;
}

/* ---------- estructura, navegación y rango ---------- */
const ICON = {
  resumen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  horario: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  videos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z"/></svg>',
  recomendaciones: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  formula: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.2L4.6 18.4A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-2.6L14 9.2V3"/><path d="M7.5 15h9"/></svg>',
  audiencia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18.5 14.7c1.6.8 2.7 2.5 3 5.3"/></svg>',
};
const PAGES = [
  { id: "resumen", l: "Resumen", sub: "Cómo va tu cuenta en el rango elegido", fn: pageResumen },
  { id: "horario", l: "Mejor horario", s: "Horario", sub: "Cuándo publicar y qué resultado esperar", fn: pageHorario, noRange: true },
  { id: "videos", l: "Videos", sub: "El rendimiento de cada video publicado en el rango", fn: pageVideos },
  { id: "recomendaciones", l: "Recomendaciones", s: "Consejos", sub: "Qué hacer, ordenado por importancia", fn: pageReco },
  { id: "formula", l: "Fórmula TikTok", s: "Fórmula", sub: "Cómo funciona el algoritmo y qué le funciona a tu cuenta", fn: pageFormula, noRange: true },
  { id: "audiencia", l: "Audiencia", sub: "Quiénes son tus seguidores", fn: pageAudiencia, noRange: true },
];
function setRange(from, to) {
  if (from > to) [from, to] = [to, from];
  S.from = from < MIN ? MIN : from > MAX ? MAX : from; S.to = to > MAX ? MAX : to < MIN ? MIN : to;
  try { localStorage.setItem("rango", JSON.stringify([S.from, S.to])); } catch (e) {}
  renderToolbar(); renderPage();
}
const PRESETS = [
  { l: "7 días", f: () => [addD(MAX, -6), MAX] }, { l: "14 días", f: () => [addD(MAX, -13), MAX] }, { l: "30 días", f: () => [addD(MAX, -29), MAX] },
  { l: "60 días", f: () => [addD(MAX, -59), MAX] }, { l: "Este mes", f: () => [MAX.slice(0, 8) + "01", MAX] },
  { l: "Mes pasado", f: () => { const d = new Date(Date.parse(MAX.slice(0, 8) + "01T12:00:00Z") - 864e5).toISOString().slice(0, 10); return [d.slice(0, 8) + "01", d]; } },
  { l: "Todo", f: () => [MIN, MAX] },
];
function renderToolbar() {
  const pg = PAGES.find((p) => p.id === S.page);
  $("#range").style.display = pg.noRange ? "none" : "flex";
  $("#range").innerHTML = `<div class="chips" role="group" aria-label="Rangos rápidos">${PRESETS.map((p, i) => { const [a, b] = p.f(); return `<button data-preset="${i}" aria-pressed="${a === S.from && b === S.to}">${p.l}</button>`; }).join("")}</div>
    <div class="dates"><label for="dFrom">Desde</label><input type="date" id="dFrom" min="${MIN}" max="${MAX}" value="${S.from}"><label for="dTo">hasta</label><input type="date" id="dTo" min="${MIN}" max="${MAX}" value="${S.to}"></div>`;
}
function renderNav() {
  $("#nav").innerHTML = PAGES.map((p) => `<button data-page="${p.id}" ${p.id === S.page ? 'aria-current="page"' : ""}>${ICON[p.id]}<span class="full">${p.l}</span><span class="short">${p.s || p.l}</span></button>`).join("");
}
function renderPage() {
  const pg = PAGES.find((p) => p.id === S.page);
  $("#title").textContent = pg.l;
  $("#sub").textContent = pg.noRange ? pg.sub : `${pg.sub} · ${dFmt(S.from, { day: "numeric", month: "short", year: "numeric" })} al ${dFmt(S.to, { day: "numeric", month: "short", year: "numeric" })}`;
  const x = ctx();
  if (!pg.noRange && !x.rows.length) { $("#content").innerHTML = '<div class="card empty">No hay datos en ese rango. Elige otras fechas.</div>'; return; }
  $("#content").innerHTML = pg.fn(x);
  if (S.page === "resumen") $("#kdetail").innerHTML = kdetail(x);
}
function go(id) { S.page = id; try { history.replaceState(null, "", "#" + id); } catch (e) {} renderNav(); renderToolbar(); renderPage(); window.scrollTo(0, 0); }

document.addEventListener("click", (e) => {
  const t = e.target;
  let b;
  if ((b = t.closest("[data-page]"))) return go(b.dataset.page);
  if ((b = t.closest("[data-go]"))) return go(b.dataset.go);
  if ((b = t.closest("[data-preset]"))) { const [a, z] = PRESETS[+b.dataset.preset].f(); return setRange(a, z); }
  if ((b = t.closest("[data-metric]"))) { S.metric = b.dataset.metric; return renderPage(); }
  if ((b = t.closest("[data-kpi]"))) { S.kpi = S.kpi === b.dataset.kpi ? null : b.dataset.kpi; renderPage(); return; }
  if ((b = t.closest("[data-sort]"))) { const k = b.dataset.sort; S.sort = { k, dir: S.sort.k === k ? -S.sort.dir : -1 }; return redrawVideos(); }
  if ((b = t.closest("[data-vid]"))) { S.open = S.open === b.dataset.vid ? null : b.dataset.vid; return redrawVideos(); }
  if (t.id === "csv") return exportCsv();
  if ((b = t.closest("[data-act]"))) {
    const a = b.dataset.act;
    if (a === "print") return window.print();
    if (a === "full") return document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
    if (a === "theme") { const order = ["auto", "dark", "light"], cur = document.documentElement.dataset.theme || "auto"; setTheme(order[(order.indexOf(cur) + 1) % 3]); }
  }
});
function setTheme(t) {
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { localStorage.setItem("tema", t); } catch (e) {}
  const el = $("#themeTxt"); if (el) el.textContent = t === "dark" ? "Oscuro" : t === "light" ? "Claro" : "Auto";
}
try { const t = localStorage.getItem("tema"); if (t) setTheme(t); } catch (e) {}
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "vq") { S.q = t.value; redrawVideos(); }
  if (t.id === "goalIn") { try { localStorage.setItem("meta-" + S.to.slice(0, 7), t.value); } catch (er) {} clearTimeout(window._g); window._g = setTimeout(renderPage, 500); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "dFrom" || t.id === "dTo") { const f = $("#dFrom").value, z = $("#dTo").value; if (f && z) setRange(f, z); }
  if (t.id === "vs") { S.sort = { k: t.value, dir: -1 }; redrawVideos(); }
});
function redrawVideos() { const el = $("#vtable"); if (el) el.innerHTML = videoTable(ctx()); }
function exportCsv() {
  const list = videoList(ctx()), cols = ["Fecha", "Descripción", "Vistas", "Me gusta", "Comentarios", "Compartidos", "Guardados", "Lo ve completo", "Seguidores nuevos", "Seguidores por 1000 vistas", "Visitas al perfil"];
  const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
  const csv = [cols.join(","), ...list.map((v) => [v.fecha, q(v.caption), v.views, v.likes, v.comments, v.shares, v.favorites, v.full_rate, v.new_followers, v.segK.toFixed(2), v.profile_views].join(","))].join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = "videos-tiktok.csv"; a.click();
}
const tip = $("#tip");
document.addEventListener("mousemove", (e) => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el) { tip.style.opacity = 0; return; }
  tip.textContent = el.dataset.tip; tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY + 14 + "px";
});
document.addEventListener("click", (e) => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el && matchMedia("(hover:none)").matches) { tip.textContent = el.dataset.tip; tip.style.opacity = 1; tip.style.left = Math.max(8, Math.min(e.clientX - 40, innerWidth - 200)) + "px"; tip.style.top = e.clientY - 40 + "px"; } });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (PAGES.some((p) => p.id === id) && id !== S.page) go(id); });

fetch("data.json?v=" + Date.now()).then((r) => r.json()).then((d) => {
  if (!d.diario || d.diario.length < 3) throw new Error("Aún no hay suficientes datos");
  DATA = d; OFF = typeof d.tz_offset === "number" ? d.tz_offset : -5; MIN = d.diario[0].date; MAX = d.diario.at(-1).date;
  $("#brandName").textContent = d.cuenta; $("#brandUser").textContent = d.usuario ? "@" + d.usuario : "TikTok";
  const hrs = Math.round((Date.now() - Date.parse(d.actualizado)) / 36e5);
  $("#foot").textContent = `Datos al ${dFmt(MAX, { day: "numeric", month: "long" })}. Actualizado ${hrs < 1 ? "hace minutos" : hrs < 24 ? "hace " + hrs + " h" : "hace " + Math.round(hrs / 24) + " días"}.`;
  $("#sub").textContent = "";
  if (d.demo) $("#banner").innerHTML = '<div class="banner">Estás viendo datos de ejemplo. Tras la primera actualización real aparecerán tus datos.</div>';
  const h = location.hash.slice(1); if (PAGES.some((p) => p.id === h)) S.page = h;
  let r = null; try { r = JSON.parse(localStorage.getItem("rango") || "null"); } catch (e) {}
  const [a, z] = r && r[0] >= MIN && r[1] <= MAX && r[0] <= r[1] ? r : PRESETS[2].f();
  S.from = a < MIN ? MIN : a; S.to = z;
  renderNav(); renderToolbar(); renderPage();
}).catch((e) => { $("#content").innerHTML = `<div class="card empty">No pude cargar los datos.<br><small>${esc(e.message)}</small></div>`; });
</script>
